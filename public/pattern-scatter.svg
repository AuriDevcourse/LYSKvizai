<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!--
    Quizmo pattern: scatter. Sparse mixed shapes. Quiet enough to sit behind body text.

    Seamless by construction: a shape reaching past a tile edge is drawn
    again on the opposite edge.

    COLOUR COMES FROM CSS. Apply it with mask-image and set background-color;
    an SVG used as background-image is its own document, so currentColor in
    here never sees the page colour. Recipe in the folder README.
  -->
  <g fill="currentColor" stroke="none">
    <rect x="27.0" y="39.0" width="30" height="30" rx="9" transform="rotate(14 42.0 54.0)" opacity="1.0"/>
    <circle cx="150.0" cy="38.0" r="15" opacity="1.0"/>
    <rect x="183.0" y="107.0" width="26" height="26" rx="7" transform="rotate(45 196.0 120.0)" opacity="1.0"/>
    <path d="M76.2,131.0 L83.4,164.9 L50.4,154.2 Z" stroke="currentColor" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/>
    <circle cx="128.0" cy="186.0" r="13" opacity="1.0"/>
    <rect x="197.0" y="201.0" width="26" height="26" rx="8" transform="rotate(-12 210.0 214.0)" opacity="1.0"/>
    <rect x="197.0" y="-39.0" width="26" height="26" rx="8" transform="rotate(-12 210.0 -26.0)" opacity="1.0"/>
    <rect x="5.0" y="185.0" width="22" height="22" rx="6" transform="rotate(45 16.0 196.0)" opacity="1.0"/>
    <rect x="245.0" y="185.0" width="22" height="22" rx="6" transform="rotate(45 256.0 196.0)" opacity="1.0"/>
    <circle cx="236.0" cy="86.0" r="11" opacity="1.0"/>
    <circle cx="-4.0" cy="86.0" r="11" opacity="1.0"/>
  </g>
</svg>
