<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!--
    Quizmo pattern: grid. Even grid of squares, one rotated. Order with one thing out of step.

    Seamless by construction: a shape reaching past a tile edge is drawn
    again on the opposite edge.

    COLOUR COMES FROM CSS. Apply it with mask-image and set background-color;
    an SVG used as background-image is its own document, so currentColor in
    here never sees the page colour. Recipe in the folder README.
  -->
  <g fill="currentColor" stroke="none">
    <rect x="43.0" y="43.0" width="34" height="34" rx="10" transform="rotate(0 60.0 60.0)" opacity="1.0"/>
    <rect x="163.0" y="43.0" width="34" height="34" rx="10" transform="rotate(0 180.0 60.0)" opacity="1.0"/>
    <rect x="43.0" y="163.0" width="34" height="34" rx="10" transform="rotate(12 60.0 180.0)" opacity="1.0"/>
    <rect x="163.0" y="163.0" width="34" height="34" rx="10" transform="rotate(0 180.0 180.0)" opacity="1.0"/>
  </g>
</svg>
