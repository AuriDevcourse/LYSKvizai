    <rect x="132.0" y="42.0" width="16" height="16" rx="4" transform="rotate(45 140.0 50.0)" opacity="1.0"/>
    <rect x="187.0" y="19.0" width="18" height="18" rx="6" transform="rotate(-18 196.0 28.0)" opacity="1.0"/>
    <circle cx="36.0" cy="104.0" r="7" opacity="1.0"/>
    <path d="M106.5,98.2 L125.0,111.1 L104.5,120.6 Z" stroke="currentColor" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/>
    <rect x="181.0" y="113.0" width="14" height="14" rx="4" transform="rotate(45 188.0 120.0)" opacity="1.0"/>
    <rect x="54.0" y="154.0" width="20" height="20" rx="6" transform="rotate(10 64.0 164.0)" opacity="1.0"/>
    <circle cx="144.0" cy="170.0" r="10" opacity="1.0"/>
    <path d="M219.7,170.1 L227.5,189.4 L206.9,186.5 Z" stroke="currentColor" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" opacity="1.0"/>
    <rect x="9.5" y="213.5" width="13" height="13" rx="4" transform="rotate(45 16.0 220.0)" opacity="1.0"/>
    <circle cx="110.0" cy="226.0" r="8" opacity="1.0"/>
  </g>
</svg>
