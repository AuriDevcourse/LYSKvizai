<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
  <!--
    Quizmo background plate: empty. A small pile of shapes at rest, for empty states.

    Authored, not generated. No opaque ground of its own, so whatever sits behind
    it still shows through; the app mounts its atmosphere once in layout.tsx and
    forbids per page backgrounds. Drop it in as an absolutely positioned,
    pointer-events none overlay and set its own opacity to taste.
  -->
  <g opacity="1.00"><path d="M286,326 L321,449 L197,418 Z" fill="#3a3634" stroke="#3a3634" stroke-width="44" stroke-linejoin="round"/></g>
  <rect x="350" y="330" width="132" height="132" rx="38" transform="rotate(-8 416 396)" fill="#ff9062" opacity="1.00"/>
  <circle cx="532" cy="414" r="56" fill="#3a3634" opacity="1.00"/>
  <rect x="301" y="295" width="86" height="86" rx="26" transform="rotate(45 344 338)" fill="#3a3634" opacity="0.75"/>
</svg>
