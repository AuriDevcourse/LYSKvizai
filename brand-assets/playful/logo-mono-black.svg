<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3897 1054" width="3897" height="1054" role="img" aria-label="Quizmo">
  <title>Quizmo</title>
  <!--
    The Quizmo logo. The drawn Q *is* the word's capital, so the letter appears
    once: an orange Q mark sitting beside a typeset "Quizmo" read as "Q Quizmo",
    which is the note this revision fixes.

    The letters are outlines, not a webfont reference, so this renders anywhere
    with no font to load. Source: Baloo 2 instanced at weight 800 (OFL).
    Cap height is 1000 units; the mark's ink height is 1.04x the letter's, an
    optical bump because round forms read small beside flat-sided ones.

    The mark alone (mark-primary.svg) is the icon. There is no mark-plus-Quizmo
    lockup by design; for square spaces use the mark alone, or the stacked
    version which sets the name lowercase.
  -->
  <g transform="translate(-36.53 -54.12) scale(2.17646)">
    <g mask="url(#counter-mono-black)">
      <line x1="326.7" y1="318.7" x2="410.1" y2="402.1"
            stroke="#0e0e0e" stroke-width="104" stroke-linecap="round"
            transform="rotate(-6 256 248)"/>
      <circle cx="256" cy="248" r="168" fill="#0e0e0e"/>
    </g>
  </g>
  <defs>
    <mask id="counter-mono-black" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <rect x="170" y="162" width="172"
            height="172" rx="44" fill="#000"
            transform="rotate(-6 256 248)"/>
    </mask>
  </defs>
